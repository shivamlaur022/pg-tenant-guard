name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    steps:
      - uses: actions/checkout@v4
      - name: Installer is up to date
        run: ./scripts/build.sh --check
      - name: Run pgTAP suite
        run: ./scripts/test.sh
        env:
          PG_VERSION: ${{ matrix.pg }}
          VERBOSE: "1"
